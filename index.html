<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Display Query String</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        #output { font-size: 24px; color: #2563eb; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>Welcome! Here is the text from your link:</h2>
    <div id="output">Loading...</div>

    <script>
        // 1. Get the query parameters from the URL
        const urlParams = new URLSearchParams(window.location.search);

        // 2. Extract a specific parameter (e.g., ?text=Hello+World)
        const userText = urlParams.get('text');

        // 3. Display it on the screen
        const outputDiv = document.getElementById('output');
        
        if (userText) {
            outputDiv.textContent = userText;
        } else {
            outputDiv.textContent = "No text provided in the link! Try adding ?text=YourMessage to the URL.";
        }
    </script>

</body>
</html>
